name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    # Three platforms because mkit shells out to git, gradle, adb and a JDK, and
    # finds each of them differently per OS. Everything here runs against the
    # fake Play service in tests/ — no job touches a real account.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: uv sync --all-extras --dev

      - name: Tests
        run: uv run pytest -q

      - name: Generated docs are current
        # docs/commands.md is generated from the command registry; a stale one
        # means a flag was changed without the reference following it.
        run: uv run python scripts/gen_docs.py && git diff --exit-code docs/commands.md
