[project]
name = "mkit-android"
dynamic = ["version"]
description = "One engine for Android release, Play Console and Firebase operations, for humans and AI agents."
readme = "README.md"
license = "MIT"
authors = [{ name = "Nurullah Al-Masum" }]
keywords = ["android", "google-play", "flutter", "release", "firebase", "aso"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Build Tools",
]
requires-python = ">=3.11"
dependencies = [
    "google-api-python-client>=2.150",
    "google-auth>=2.35",
    "requests>=2.32",
    "Pillow>=11",
]

[project.urls]
Homepage = "https://github.com/almasumdev/mkit-android"
Issues = "https://github.com/almasumdev/mkit-android/issues"
Changelog = "https://github.com/almasumdev/mkit-android/blob/main/CHANGELOG.md"

[project.scripts]
mkit = "mkit.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/mkit/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
