[project]
name = "mkit-cli"
dynamic = ["version"]
description = "Release Android apps to Google Play from the command line: build, upload, listing, screenshots, data safety, in-app products, vitals and Firebase, in one tool built for humans and AI agents."
readme = "README.md"
license = "MIT"
authors = [{ name = "Nurullah Al-Masum" }]
keywords = ["android", "google-play", "flutter", "release", "firebase", "aso"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: System :: Software Distribution",
]
requires-python = ">=3.11"
dependencies = [
    "google-api-python-client>=2.150",
    "google-auth>=2.35",
    "requests>=2.32",
    "Pillow>=11",
]

[project.urls]
Homepage = "https://github.com/almasumdev/mkit-cli"
Documentation = "https://github.com/almasumdev/mkit-cli/blob/main/docs/commands.md"
Repository = "https://github.com/almasumdev/mkit-cli"
Issues = "https://github.com/almasumdev/mkit-cli/issues"
Changelog = "https://github.com/almasumdev/mkit-cli/blob/main/CHANGELOG.md"

[project.scripts]
mkit = "mkit.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/mkit/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
